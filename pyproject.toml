[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfo-platform"
version = "0.1.0"
description = "AI CFO platform: multi-client financial data import, analytics, and reporting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RealTech", email = "al@realtechbk.com" }]

dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
cfo-platform = "cfo_platform.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cfo_platform"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["cfo_platform"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "regression: permanent end-to-end regression tests against real data/raw/ files (slower; run with -m regression, exclude with -m 'not regression')",
]
